name = "testagram-cdn"
main = "worker.js"
compatibility_date = "2026-11-15"
workers_dev = false
preview_urls = false

# The API hostname is a Worker Custom Domain. The guarded cutover
# transfers it from the old API Worker to this gateway, and Wrangler manages
# the hostname's DNS/TLS binding. The gateway still proxies to the Backend
# origin supplied through API_ORIGIN; it is not the identity authority.
[[routes]]
pattern = "api.testagram.site"
custom_domain = true

# testagram.site remains the Backend/Federation identity hostname. The Worker
# sends it to the dedicated Caddy listener: ActivityPub stays on the apex,
# while ordinary web paths receive the canonical redirect to www.
[[routes]]
pattern = "testagram.site/*"
zone_name = "testagram.site"

# www is served by the self-hosted Flutter container behind the same dedicated
# Caddy listener; the Worker forwards the public host for private-edge routing.
[[routes]]
pattern = "www.testagram.site/*"
zone_name = "testagram.site"

# media.testagram.site is already attached to this Worker as a Custom Domain.
# Updating this script replaces the old R2-serving implementation in place.
[[routes]]
pattern = "media.testagram.site"
custom_domain = true

[observability]
enabled = true
