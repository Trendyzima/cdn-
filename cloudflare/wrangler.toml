name = "testagram-cdn"
main = "worker.js"
compatibility_date = "2026-10-08"
workers_dev = false

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "testagram-media"

[observability]
enabled = true

# Only route Backend-asserted private user media through this Worker.
# Do not capture public media paths until their delivery contract is implemented.
[[routes]]
pattern = "media.testagram.site/v1/users/*"
zone_name = "testagram.site"

[[routes]]
pattern = "media.testagram.site/healthz"
zone_name = "testagram.site"

[[routes]]
pattern = "media.testagram.site/readyz"
zone_name = "testagram.site"
