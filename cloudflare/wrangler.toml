name = "testagram-cdn"
main = "worker.js"
compatibility_date = "2026-11-15"
workers_dev = false
preview_urls = false

# These custom domains are the public gateway only. API_ORIGIN and CDN_ORIGIN
# are the verified, per-machine InstaBox HTTPS port URLs supplied at release.
[[routes]]
pattern = "api.testagram.site"
custom_domain = true

[[routes]]
pattern = "media.testagram.site"
custom_domain = true

[observability]
enabled = true
