name = "testagram-cdn"
main = "worker.js"
compatibility_date = "2026-10-08"
workers_dev = false
preview_urls = false

# Deliberately no custom-domain routes. The Go CDN owns media.testagram.site.
# Deploying this script does not activate it on a public hostname. A separate
# hostname, API contract and security review are required before adding routes.

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "testagram-media"

[observability]
enabled = true
