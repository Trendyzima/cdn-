name: Production Media Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/production-media-smoke.yml"

permissions:
  contents: read

jobs:
  public-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove first-party Go CDN ownership
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15             -D /tmp/health.headers -o /tmp/health.json             https://media.testagram.site/healthz
          grep -Eiq '^x-testagram-cdn:[[:space:]]*testagram-edge[[:space:]]*$' /tmp/health.headers
          grep -Eiq '^x-testagram-cdn-version:[[:space:]]*2026-10-08-go-edge-iptv-v1[[:space:]]*$' /tmp/health.headers
          grep -q '"ok":true' /tmp/health.json

      - name: Verify CDN prefetch metrics
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15             https://media.testagram.site/metrics > /tmp/metrics.txt
          grep -q '^testagram_edge_tv_prefetch_success_total ' /tmp/metrics.txt
          grep -q '^testagram_edge_tv_prefetch_failures_total ' /tmp/metrics.txt
          grep -q '^testagram_edge_tv_prefetch_warmed_seconds_total ' /tmp/metrics.txt

  self-contained-iptv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run fixture-backed IPTV E2E
        run: go test ./internal/edge -run 'TestTVSelfContainedIPTV|TestTVPrefetchParsesRealHLSPlaylistAndThirtySeconds|TestTVPrefetchDoesNotTreatVariantPlaylistAsMedia' -count=1 -v
