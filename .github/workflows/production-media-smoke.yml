name: Production CDN Integration Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy private R2 media Worker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-cdn:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify canonical Go CDN identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            -D /tmp/health.headers -o /tmp/health.json \
            https://media.testagram.site/healthz
          grep -Eiq '^x-testagram-cdn:[[:space:]]*testagram-edge[[:space:]]*$' /tmp/health.headers
          grep -Eiq '^x-testagram-cdn-version:[[:space:]]*2026-10-08-go-edge-iptv-v1[[:space:]]*$' /tmp/health.headers
          grep -q '"ok":true' /tmp/health.json
          grep -q '"service":"testagram-cdn"' /tmp/health.json

      - name: Verify Go CDN readiness and trusted origin configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            -D /tmp/ready.headers -o /tmp/ready.body \
            https://media.testagram.site/readyz
          grep -Eiq '^x-testagram-cdn:[[:space:]]*testagram-edge[[:space:]]*$' /tmp/ready.headers
          grep -qx 'ready' /tmp/ready.body

      - name: Verify private media authorization is delegated and denied safely
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 \
            -H 'Authorization: Bearer deliberately-invalid-cdn-smoke-assertion' \
            -o /tmp/private-denied.body -w '%{http_code}' \
            https://media.testagram.site/v1/users/cdn-smoke/0123456789abcdef0123456789abcdef)"
          test "$status" = "401"
          grep -Eiq 'unauthorized|not authorized|invalid' /tmp/private-denied.body
