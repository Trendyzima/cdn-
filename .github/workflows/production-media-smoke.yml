name: Canonical Go CDN Production Smoke

# This smoke targets the canonical Go CDN. It is manual until the Data Centre
# deployment controller invokes it after promoting a pinned image digest.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-cdn:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect canonical Go CDN identity
        id: health
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 15 \
            -D /tmp/health.headers -o /tmp/health.json -w '%{http_code}' \
            https://media.testagram.site/healthz)"
          echo "health_status=$status"
          echo "--- response headers ---"
          cat /tmp/health.headers
          echo "--- response body ---"
          cat /tmp/health.json
          test "$status" = "200"
          grep -Eiq '^x-testagram-cdn:[[:space:]]*testagram-edge[[:space:]]*$' /tmp/health.headers
          grep -Eiq '^x-testagram-cdn-version:[[:space:]]*2026-11-13-backend-origin-hardened-v1[[:space:]]*$' /tmp/health.headers
          grep -q '"ok":true' /tmp/health.json
          grep -q '"service":"testagram-cdn"' /tmp/health.json

      - name: Verify Go CDN readiness and trusted origin configuration
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 15 \
            -D /tmp/ready.headers -o /tmp/ready.body -w '%{http_code}' \
            https://media.testagram.site/readyz)"
          echo "ready_status=$status"
          cat /tmp/ready.headers
          cat /tmp/ready.body
          test "$status" = "200"
          grep -Eiq '^x-testagram-cdn:[[:space:]]*testagram-edge[[:space:]]*$' /tmp/ready.headers
          grep -qx 'ready' /tmp/ready.body

      - name: Verify private media rejects a missing viewer assertion
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 \
            -D /tmp/private.headers -o /tmp/private.body -w '%{http_code}' \
            https://media.testagram.site/v1/users/cdn-smoke/0123456789abcdef0123456789abcdef)"
          echo "private_status=$status"
          cat /tmp/private.headers
          cat /tmp/private.body
          test "$status" = "401"
          grep -Eiq 'viewer assertion|required|unauthorized|not authorized|invalid' /tmp/private.body
