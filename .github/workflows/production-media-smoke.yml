name: Production Media Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy private R2 media Worker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  ownership:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify deployed R2 Worker identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            -D /tmp/health.headers -o /tmp/health.json \
            https://media.testagram.site/healthz
          cat /tmp/health.headers
          cat /tmp/health.json
          grep -Eiq '^x-testagram-cdn:[[:space:]]*r2-edge[[:space:]]*$' /tmp/health.headers
          grep -Eiq '^x-testagram-cdn-version:[[:space:]]*2026-11-12-r2-backend-assertion-v1[[:space:]]*$' /tmp/health.headers
          grep -q '"version":"2026-11-12-r2-backend-assertion-v1"' /tmp/health.json

      - name: Verify Worker readiness and R2 binding
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            -D /tmp/ready.headers -o /tmp/ready.json \
            https://media.testagram.site/readyz
          cat /tmp/ready.headers
          cat /tmp/ready.json
          grep -Eiq '^x-testagram-cdn:[[:space:]]*r2-edge[[:space:]]*$' /tmp/ready.headers
          grep -q '"ok":true' /tmp/ready.json

      - name: Verify private user media fails closed without viewer assertion
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 15 \
            -o /tmp/private-denied.json -w '%{http_code}' \
            https://media.testagram.site/v1/users/smoke/0123456789abcdef0123456789abcdef)"
          cat /tmp/private-denied.json
          test "$status" = "401"
