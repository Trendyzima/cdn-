name: Release Go CDN

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/...

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        env:
          IMAGE: ghcr.io/trendyzima/testagram-edge
        run: |
          set -euo pipefail
          docker build --pull -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:main" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"

      - name: Create deployment manifest
        run: |
          mkdir -p release
          cat > release/testagram-edge-release.env <<EOF
          TESTAGRAM_EDGE_IMAGE=ghcr.io/trendyzima/testagram-edge:$GITHUB_SHA
          TESTAGRAM_EDGE_VERSION=2026-10-08-go-edge-iptv-v1
          TESTAGRAM_EDGE_MEDIA_HOST=media.testagram.site
          EOF

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: testagram-edge-release
          path: release/testagram-edge-release.env
