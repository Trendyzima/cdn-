name: Standalone CDN Source Verification (Deployment Lives in XClone)

on:
  push:
    branches: [main]
    paths: ["cmd/**", "internal/**", "Dockerfile", "go.mod", "go.sum", ".github/workflows/deploy-production.yml"]
  pull_request:
    paths: ["cmd/**", "internal/**", "Dockerfile", "go.mod", "go.sum", ".github/workflows/deploy-production.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build container
        run: docker build --pull -t testagram-cdn:ci -f Dockerfile .
      - name: Explain canonical deployment owner
        run: |
          echo "Standalone source verification passed."
          echo "Production deployment is owned by Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr."
          echo "No SSH host/user/key, GHCR token, Cloudflare token, or CDN deployment secret is requested here."
