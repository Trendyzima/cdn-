name: Go CDN Source Verification (No Production Deploy)

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "!internal/**/*_test.go"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths: ["cmd/**", "internal/**", "Dockerfile", "go.mod", "go.sum", ".github/workflows/deploy-production.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build container
        run: docker build --pull -t testagram-cdn:ci -f Dockerfile .
      - name: Explain canonical deployment owner
        run: |
          echo "Standalone source verification passed."
          echo "This workflow verifies source only; production deployment ownership and automation are tracked in Data Centre issue #53."
          echo "No SSH host/user/key, GHCR token, Cloudflare token, or CDN deployment secret is requested here."
