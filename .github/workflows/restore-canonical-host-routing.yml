name: Restore canonical Testagram API, Go CDN, web and apex federation routing

on:
  workflow_dispatch:
    inputs:
      confirm_canonical_host_routing:
        description: "Explicitly authorize updating the production Cloudflare Worker for API, media, www web and apex federation hostnames"
        required: true
        type: boolean
        default: false
      confirm_legacy_api_domain_transfer:
        description: "Separately authorize detaching api.testagram.site from the exact legacy testagram-api Worker and transferring it to testagram-cdn"
        required: true
        type: boolean
        default: false
      # InstaBox publishes deterministic port hostnames for the selected machine.
      # Derive all three origins from machine_id; never ask an operator to
      # paste a hostname or accidentally place the machine ID in an origin field.
      machine_id:
        description: "Exact InstaBox machine ID for testagramdb; confirm against the Backend deployment summary"
        required: true
        type: string
        default: m_agq4me2xgrgx5ge52ts437tqea

permissions:
  contents: read

concurrency:
  group: testagram-canonical-host-routing
  cancel-in-progress: false

jobs:
  reconcile:
    name: Deploy canonical API, media and apex federation gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Reuse the already-provisioned Backend deployment credentials; retain
      # the older secret name only as a compatibility fallback.
      MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID || inputs.machine_id }}
      INSTABOX_API_KEY: ${{ secrets.TESTAGRAM_DB_API || secrets.INSTABOX_API_KEY }}
      CONFIRM_CANONICAL_HOST_ROUTING: ${{ inputs.confirm_canonical_host_routing }}
      CONFIRM_LEGACY_API_DOMAIN_TRANSFER: ${{ inputs.confirm_legacy_api_domain_transfer }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate origins and prove both upstream services before cutover
        id: validate_origins
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRM_CANONICAL_HOST_ROUTING" == "true" ]] || { echo "::error::Set confirm_canonical_host_routing=true to authorize the production Worker deployment."; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$INSTABOX_API_KEY" || { echo "::error::Missing INSTABOX_API_KEY repository secret for request-triggered machine recovery."; exit 1; }
          [[ "$MACHINE_ID" =~ ^m_[a-z2-7]{26}$ ]] || { echo "::error::MACHINE_ID is not a valid InstaBox machine ID."; exit 1; }
          MACHINE_SUFFIX="${MACHINE_ID#m_}"
          API_ORIGIN="https://8080-${MACHINE_SUFFIX}.instabox.tech"
          CDN_ORIGIN="https://8081-${MACHINE_SUFFIX}.instabox.tech"
          APEX_ORIGIN="https://8443-${MACHINE_SUFFIX}.instabox.tech"
          export API_ORIGIN CDN_ORIGIN APEX_ORIGIN
          echo "Derived API, CDN and Caddy origins from the selected InstaBox machine and published port numbers."
          python3 - "$API_ORIGIN" "$CDN_ORIGIN" "$APEX_ORIGIN" "$MACHINE_ID" <<'PY'
          import ipaddress, re, sys
          from urllib.parse import urlparse
          for label, raw, canonical in (
              ("API_ORIGIN", sys.argv[1], "api.testagram.site"),
              ("CDN_ORIGIN", sys.argv[2], "media.testagram.site"),
              ("APEX_ORIGIN", sys.argv[3], "testagram.site"),
          ):
              u = urlparse(raw)
              if (u.scheme != "https" or not u.hostname or u.username or u.password
                  or u.path not in ("", "/") or u.query or u.fragment or u.port
                  or u.hostname == canonical or u.hostname == "testagram.site"
                  or u.hostname.endswith(".testagram.site")
                  or u.hostname == "api.instabox.sh"
                  or u.hostname == "localhost"
                  or u.hostname.endswith((".local", ".internal", ".example", ".invalid", ".test", ".onion",
                                           ".workers.dev", ".pages.dev", ".cloudflare.com", ".cloudflare.net"))):
                  raise SystemExit(f"{label} must be a plain HTTPS origin on a separate public hostname")
              try:
                  ipaddress.ip_address(u.hostname)
              except ValueError:
                  pass
              else:
                  raise SystemExit(f"{label} must use the InstaBox public hostname, not a literal IP")
          if len({urlparse(value).hostname for value in sys.argv[1:4]}) != 3:
              raise SystemExit("API_ORIGIN, CDN_ORIGIN and APEX_ORIGIN must use three different published port hostnames")
          if not re.fullmatch(r"m_[a-z2-7]{26}", sys.argv[4]):
              raise SystemExit("MACHINE_ID must match the exact InstaBox ID format m_ plus 26 lowercase base32 characters")
          PY
          machine_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/instabox-machine.json -w '%{http_code}' -H "X-API-Key: $INSTABOX_API_KEY" "https://api.instabox.sh/v1/machines/$MACHINE_ID" || true)"
          if [[ "$machine_status" != "200" ]] || ! jq -e '.state != null' /tmp/instabox-machine.json >/dev/null; then
            echo "::error::Could not verify the selected InstaBox machine with the supplied recovery credential (HTTP $machine_status)."
            jq -c '{id,state,error}' /tmp/instabox-machine.json 2>/dev/null || true
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          api_status="$(curl -sS --connect-timeout 5 --max-time 15 -D "$tmp/api.headers" -o "$tmp/api.json" -w '%{http_code}' "$API_ORIGIN/healthz" || true)"
          if [[ "$api_status" != "200" ]] ||
             ! grep -Eiq '^x-testagram-service:[[:space:]]*testagram-api[[:space:]]*$' "$tmp/api.headers" ||
             ! jq -e '.ok == true and .service == "testagram-api"' "$tmp/api.json" >/dev/null; then
            echo "::error::API_ORIGIN is not serving the expected Testagram Backend health identity (HTTP $api_status)."
            cat "$tmp/api.headers" "$tmp/api.json" 2>/dev/null || true
            exit 1
          fi
          # The TV monitor's OIDC-protected route must exist on the selected
          # Backend origin. A 401 without a token proves the handler is present;
          # a 404 means the deployed Backend image is stale or the origin is wrong.
          tv_catalog_status="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp/tv-catalog-unauth.json" -w '%{http_code}' "$API_ORIGIN/internal/tv/catalog" || true)"
          if [[ "$tv_catalog_status" != "401" ]]; then
            echo "::error::Backend origin does not expose the protected TV catalogue handler (expected 401 without OIDC token, got HTTP $tv_catalog_status)."
            cat "$tmp/tv-catalog-unauth.json" 2>/dev/null || true
            exit 1
          fi
          for path in /readyz /metrics; do
            status="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$API_ORIGIN$path" || true)"
            [[ "$status" == "404" ]] || { echo "::error::Backend origin exposes private endpoint $path (HTTP $status)."; exit 1; }
          done

          cdn_status="$(curl -sS --connect-timeout 5 --max-time 15 -D "$tmp/cdn.headers" -o "$tmp/cdn.json" -w '%{http_code}' "$CDN_ORIGIN/healthz" || true)"
          ready_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$CDN_ORIGIN/readyz" || true)"
          metrics_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$CDN_ORIGIN/metrics" || true)"
          if [[ "$cdn_status" != "200" || "$ready_status" != "404" || "$metrics_status" != "404" ]] ||
             ! grep -Eiq '^x-testagram-cdn:[[:space:]]*testagram-edge[[:space:]]*$' "$tmp/cdn.headers" ||
             ! grep -Eiq '^x-testagram-cdn-version:[[:space:]]*2026-11-15-private-health-listener-v1[[:space:]]*$' "$tmp/cdn.headers" ||
             ! jq -e '.ok == true and .service == "testagram-cdn"' "$tmp/cdn.json" >/dev/null; then
            echo "::error::CDN_ORIGIN is not serving the pinned Go CDN or exposes private readiness/metrics (health=$cdn_status readiness=$ready_status metrics=$metrics_status)."
            cat "$tmp/cdn.headers" "$tmp/cdn.json" 2>/dev/null || true
            exit 1
          fi
          private_status="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp/private" -w '%{http_code}' "$CDN_ORIGIN/v1/users/cdn-smoke/0123456789abcdef0123456789abcdef" || true)"
          case "$private_status" in
            401|403|404) ;;
            *) echo "::error::Go CDN origin did not deny unauthenticated private media (HTTP $private_status)."; cat "$tmp/private"; exit 1 ;;
          esac
          apex_health="$(curl -sS --connect-timeout 5 --max-time 20 -o "$tmp/apex-health.json" -w '%{http_code}' "$APEX_ORIGIN/_testagram/edge-health" || true)"
          apex_root="$(curl -sS --connect-timeout 5 --max-time 20 -D "$tmp/apex-root.headers" -o /dev/null -w '%{http_code}' "$APEX_ORIGIN/" || true)"
          if [[ "$apex_health" != "200" ]] || ! jq -e '.ok == true and .service == "testagram-apex-edge"' "$tmp/apex-health.json" >/dev/null; then
            echo "::error::APEX_ORIGIN is not serving the expected Caddy edge identity (HTTP $apex_health)."
            cat "$tmp/apex-health.json" 2>/dev/null || true
            exit 1
          fi
          if [[ "$apex_root" != "308" ]] || ! grep -Fqi 'https://www.testagram.site' "$tmp/apex-root.headers"; then
            echo "::error::APEX_ORIGIN root does not redirect to https://www.testagram.site (HTTP $apex_root)."
            cat "$tmp/apex-root.headers"
            exit 1
          fi

          # A 404 from an invalid hostname is not proof that WebFinger reached
          # Federation. Require the canonical NodeInfo document and a real
          # Backend-resolved account/actor before any hostname cutover.
          nodeinfo_discovery_status="$(curl -sS --connect-timeout 5 --max-time 20 -H 'Accept: application/json' -D "$tmp/nodeinfo-discovery.headers" -o "$tmp/nodeinfo-discovery.json" -w '%{http_code}' "$APEX_ORIGIN/.well-known/nodeinfo" || true)"
          nodeinfo_discovery_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$tmp/nodeinfo-discovery.headers" | tail -n1)"
          if [[ "$nodeinfo_discovery_status" != "200" || "$nodeinfo_discovery_type" != *"application/json"* ]] ||
             ! jq -e '.links | any(.rel == "http://nodeinfo.diaspora.software/ns/schema/2.1" and .href == "https://testagram.site/nodeinfo/2.1")' "$tmp/nodeinfo-discovery.json" >/dev/null 2>&1; then
            echo "::error::APEX_ORIGIN NodeInfo discovery is not the canonical Testagram JSON endpoint (HTTP $nodeinfo_discovery_status)."
            cat "$tmp/nodeinfo-discovery.json" 2>/dev/null || true
            exit 1
          fi
          nodeinfo_status="$(curl -sS --connect-timeout 5 --max-time 20 -H 'Accept: application/json' -D "$tmp/nodeinfo.headers" -o "$tmp/nodeinfo.json" -w '%{http_code}' "$APEX_ORIGIN/nodeinfo/2.1" || true)"
          nodeinfo_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$tmp/nodeinfo.headers" | tail -n1)"
          if [[ "$nodeinfo_status" != "200" || "$nodeinfo_type" != *"application/json"* ]] ||
             ! jq -e '.version == "2.1" and .software.name == "testagram" and (.protocols | index("activitypub") != null)' "$tmp/nodeinfo.json" >/dev/null 2>&1; then
            echo "::error::APEX_ORIGIN NodeInfo 2.1 document is not a valid Testagram ActivityPub document (HTTP $nodeinfo_status)."
            cat "$tmp/nodeinfo.json" 2>/dev/null || true
            exit 1
          fi

          webfinger_status="$(curl -sS --connect-timeout 5 --max-time 20 -H 'Accept: application/jrd+json' -D "$tmp/webfinger.headers" -o "$tmp/webfinger.json" -w '%{http_code}' "$APEX_ORIGIN/.well-known/webfinger?resource=acct:crissbeat@testagram.site" || true)"
          webfinger_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$tmp/webfinger.headers" | tail -n1)"
          if [[ "$webfinger_status" != "200" || "$webfinger_type" != *"application/jrd+json"* ]] ||
             ! jq -e '.subject == "acct:crissbeat@testagram.site" and (.links | any(.rel == "self" and .type == "application/activity+json" and .href == "https://testagram.site/users/crissbeat"))' "$tmp/webfinger.json" >/dev/null 2>&1; then
            echo "::error::APEX_ORIGIN did not resolve the real canonical Testagram account through WebFinger (HTTP $webfinger_status)."
            cat "$tmp/webfinger.json" 2>/dev/null || true
            exit 1
          fi
          actor_url="$(jq -r '.links[] | select(.rel == "self" and .type == "application/activity+json") | .href' "$tmp/webfinger.json" | head -n1)"
          actor_status="$(curl -sS --connect-timeout 5 --max-time 20 -H 'Accept: application/activity+json' -D "$tmp/actor.headers" -o "$tmp/actor.json" -w '%{http_code}' "$actor_url" || true)"
          actor_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$tmp/actor.headers" | tail -n1)"
          if [[ "$actor_status" != "200" || "$actor_type" != *"application/activity+json"* ]] ||
             ! jq -e --arg actor "$actor_url" '.type == "Person" and .id == $actor and .preferredUsername == "crissbeat" and .publicKey.owner == $actor and (.publicKey.publicKeyPem | type == "string" and contains("BEGIN PUBLIC KEY"))' "$tmp/actor.json" >/dev/null 2>&1; then
            echo "::error::APEX_ORIGIN actor document does not match the canonical WebFinger identity and public key (HTTP $actor_status)."
            cat "$tmp/actor.json" 2>/dev/null || true
            exit 1
          fi

          unknown_status="$(curl -sS --connect-timeout 5 --max-time 20 -H 'Accept: application/jrd+json' -D "$tmp/unknown.headers" -o "$tmp/unknown.json" -w '%{http_code}' "$APEX_ORIGIN/.well-known/webfinger?resource=acct:testagramprobe2026@testagram.site" || true)"
          unknown_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$tmp/unknown.headers" | tail -n1)"
          if [[ "$unknown_status" != "404" || "$unknown_type" != *"application/json"* ]] ||
             ! jq -e '.error == "account_not_found"' "$tmp/unknown.json" >/dev/null 2>&1; then
            echo "::error::APEX_ORIGIN unknown-account negative control did not return structured Federation account_not_found (HTTP $unknown_status)."
            cat "$tmp/unknown.json" 2>/dev/null || true
            exit 1
          fi
          www_health="$(curl -sS --connect-timeout 5 --max-time 20 -H 'X-Forwarded-Host: www.testagram.site' -o "$tmp/www-health.json" -w '%{http_code}' "$APEX_ORIGIN/healthz" || true)"
          www_root="$(curl -sS --connect-timeout 5 --max-time 20 -H 'X-Forwarded-Host: www.testagram.site' -o "$tmp/www-root.html" -w '%{http_code}' "$APEX_ORIGIN/" || true)"
          if [[ "$www_health" != "200" ]] || ! jq -e '.ok == true and .service == "testagram-web"' "$tmp/www-health.json" >/dev/null ||
             [[ "$www_root" != "200" ]] || ! grep -Fq 'flutter_bootstrap.js' "$tmp/www-root.html"; then
            echo "::error::APEX_ORIGIN does not serve the self-hosted Flutter web app when routed for www (health=$www_health root=$www_root)."
            cat "$tmp/www-health.json" "$tmp/www-root.html" 2>/dev/null || true
            exit 1
          fi
          echo "API, CDN, www Flutter web and apex Federation origins identify the expected services; private API/CDN health and media boundaries are preserved."
          {
            echo "api_origin=$API_ORIGIN"
            echo "cdn_origin=$CDN_ORIGIN"
            echo "apex_origin=$APEX_ORIGIN"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight Cloudflare zone and existing hostname ownership
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          zones="$(curl --retry 2 --retry-all-errors -fsS "$API/zones?name=testagram.site&status=active" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and (.result | length == 1)' <<<"$zones" >/dev/null || {
            echo "::error::Could not identify exactly one active testagram.site zone; verify Zone Read."
            jq -c '.errors // []' <<<"$zones"; exit 1;
          }
          zone_id="$(jq -r '.result[0].id' <<<"$zones")"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

          domains="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$domains" >/dev/null || {
            echo "::error::Cannot inspect all Worker custom domains; verify Workers Scripts Read/Write and review pagination."
            jq -c '.errors // []' <<<"$domains"; exit 1;
          }
          routes="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/workers/routes?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$routes" >/dev/null || {
            echo "::error::Cannot inspect all Worker routes; verify Zone Workers Routes Read/Write and review pagination."
            jq -c '.errors // []' <<<"$routes"; exit 1;
          }
          broad="$(jq -r '.result[]? | select(.pattern=="*.testagram.site/*") | .pattern' <<<"$routes")"
          if [[ -n "$broad" ]]; then
            echo "::error::A broad zone-wide Worker route could affect unrelated Testagram services. Review it manually before cutover:"
            printf '%s\n' "$broad"; exit 1;
          fi

          # Capture only the one known legacy API custom-domain owner. Any
          # ambiguity, unexpected Worker, inactive binding or missing ID fails
          # closed before any production mutation.
          legacy_api_domain_id=""
          legacy_api_domain_payload=""
          api_domain_owner_service=""
          api_domains="$(jq -c --arg zone "$zone_id" '[.result[]? | select(.hostname=="api.testagram.site" and .zone_id==$zone)]' <<<"$domains")"
          api_domain_count="$(jq 'length' <<<"$api_domains")"
          [[ "$api_domain_count" -le 1 ]] || {
            echo "::error::Multiple Worker custom domains own api.testagram.site; refusing ambiguous transfer."
            jq -c '.' <<<"$api_domains"; exit 1;
          }
          if [[ "$api_domain_count" == "1" ]]; then
            api_domain="$(jq -c '.[0]' <<<"$api_domains")"
            api_service="$(jq -r '.service // empty' <<<"$api_domain")"
            api_domain_owner_service="$api_service"
            api_environment="$(jq -r '.environment // "production"' <<<"$api_domain")"
            api_domain_id="$(jq -r '.id // empty' <<<"$api_domain")"
            if [[ "$api_service" == "testagram-api" && "$api_environment" == "production" ]]; then
              jq -e '.enabled == true and ((.previews_enabled // false) == false) and (.zone_id | type == "string" and length > 0)' <<<"$api_domain" >/dev/null || {
                echo "::error::The legacy API custom domain is not enabled in production or has preview routing enabled; refusing transfer."
                exit 1;
              }
              [[ -n "$api_domain_id" ]] || {
                echo "::error::The legacy API custom domain has no immutable domain ID; refusing transfer."
                exit 1;
              }
              [[ "$CONFIRM_LEGACY_API_DOMAIN_TRANSFER" == "true" ]] || {
                echo "::error::api.testagram.site is owned by testagram-api. Set confirm_legacy_api_domain_transfer=true as a separate explicit approval to transfer this exact custom domain."
                exit 1;
              }
              legacy_api_domain_id="$api_domain_id"
              legacy_api_domain_payload="$(jq -c '{hostname,service,enabled,previews_enabled,zone_id,zone_name:(.zone_name // "testagram.site")}' <<<"$api_domain" | base64 -w0)"
              echo "Captured exact production API custom-domain owner $legacy_api_domain_id for a guarded transfer with rollback."
            elif [[ "$api_service" == "testagram-cdn" && "$api_environment" == "production" ]]; then
              jq -e '.enabled == true' <<<"$api_domain" >/dev/null || {
                echo "::error::The canonical API custom domain is disabled; refusing cutover."
                exit 1;
              }
              echo "api.testagram.site is already attached to the canonical testagram-cdn Worker."
            else
              echo "::error::api.testagram.site is attached to unexpected Worker service/environment: $api_service/$api_environment."
              exit 1
            fi
          else
            [[ "$CONFIRM_LEGACY_API_DOMAIN_TRANSFER" != "true" ]] || {
              echo "::error::Legacy API domain transfer was explicitly requested but no exact legacy owner was found; refusing a stale approval."
              exit 1;
            }
            echo "No Worker custom-domain owner exists for api.testagram.site; Wrangler will create the canonical binding."
          fi
          echo "legacy_api_domain_id=$legacy_api_domain_id" >> "$GITHUB_OUTPUT"
          echo "legacy_api_domain_payload=$legacy_api_domain_payload" >> "$GITHUB_OUTPUT"

          pages_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/apex-pages-domain.json -w '%{http_code}' "$API/accounts/$CF_ACCOUNT_ID/pages/projects/testagram-flutter-web/domains/testagram.site" -H "Authorization: Bearer $CF_API_TOKEN" || true)"
          pages_attached=false
          if [[ "$pages_status" == "200" ]] && jq -e '.success == true and .result.name == "testagram.site"' /tmp/apex-pages-domain.json >/dev/null; then
            pages_attached=true
            echo "Confirmed testagram.site is attached to the expected Flutter Pages project; the guarded cutover will detach only the verified apex and www associations after all origin and route preflights pass."
          elif [[ "$pages_status" == "404" ]]; then
            echo "testagram.site is already detached from the Flutter Pages project."
          else
            echo "::error::Could not safely establish exact apex Pages ownership (HTTP $pages_status)."
            jq -c '{success,errors,messages,result}' /tmp/apex-pages-domain.json 2>/dev/null || true
            exit 1
          fi
          echo "pages_attached=$pages_attached" >> "$GITHUB_OUTPUT"

          www_pages_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/www-pages-domain.json -w '%{http_code}' "$API/accounts/$CF_ACCOUNT_ID/pages/projects/testagram-flutter-web/domains/www.testagram.site" -H "Authorization: Bearer $CF_API_TOKEN" || true)"
          www_pages_attached=false
          if [[ "$www_pages_status" == "200" ]] && jq -e '.success == true and .result.name == "www.testagram.site"' /tmp/www-pages-domain.json >/dev/null; then
            www_pages_attached=true
            echo "Confirmed www.testagram.site is attached to the expected Flutter Pages project."
          elif [[ "$www_pages_status" == "404" ]]; then
            echo "www.testagram.site is already detached from the Flutter Pages project."
          else
            echo "::error::Could not safely establish exact www Pages ownership (HTTP $www_pages_status)."
            jq -c '{success,errors,messages,result}' /tmp/www-pages-domain.json 2>/dev/null || true
            exit 1
          fi
          echo "www_pages_attached=$www_pages_attached" >> "$GITHUB_OUTPUT"

          for host in api.testagram.site media.testagram.site testagram.site www.testagram.site; do
            owners="$(jq -r --arg host "$host" --arg zone "$zone_id" '.result[]? | select(.hostname==$host and .zone_id==$zone) | [.service,(.environment // "production")] | @tsv' <<<"$domains")"
            while IFS=$'\t' read -r service environment; do
              [[ -n "$service" ]] || continue
              if [[ "$host" == "api.testagram.site" && "$service" == "testagram-api" && "$environment" == "production" ]]; then
                continue
              fi
              if [[ "$service" != "testagram-cdn" || ( "$environment" != "production" && "$environment" != "" ) ]]; then
                echo "::error::Refusing to replace $host because it is attached to unexpected Worker service/environment: $service/$environment."
                exit 1
              fi
            done <<<"$owners"

            exact_routes="$(jq -r --arg host "$host" '.result[]? | select(.pattern==($host+"/*")) | [.script,.id] | @tsv' <<<"$routes")"
            while IFS=$'\t' read -r script route_id; do
              [[ -n "$route_id" ]] || continue
              if [[ "$script" != "testagram-cdn" ]]; then
                echo "::error::Refusing to replace $host because exact Worker route belongs to $script."
                exit 1
              fi
            done <<<"$exact_routes"

          done

          # The production audit found a more-specific legacy route that sends
          # WebFinger to the Flutter Pages Worker. It wins over testagram.site/*,
          # so capture and remove only this exact known stale route.
          legacy_webfinger_route_id=""
          legacy_webfinger_routes="$(jq -r '.result[]? | select(.pattern=="testagram.site/.well-known/webfinger*") | [.script,.id] | @tsv' <<<"$routes")"
          legacy_webfinger_count="$(printf '%s\n' "$legacy_webfinger_routes" | awk 'NF { count++ } END { print count+0 }')"
          [[ "$legacy_webfinger_count" -le 1 ]] || {
            echo "::error::Multiple legacy WebFinger routes exist; refusing ambiguous ownership cleanup."
            exit 1
          }
          if [[ -n "$legacy_webfinger_routes" ]]; then
            read -r legacy_script legacy_route_id <<<"$legacy_webfinger_routes"
            [[ "$legacy_script" == "testagram-web" && -n "$legacy_route_id" ]] || {
              echo "::error::The conflicting WebFinger route belongs to unexpected Worker $legacy_script; refusing to delete it."
              exit 1
            }
            legacy_webfinger_route_id="$legacy_route_id"
            echo "Captured exact stale WebFinger route $legacy_route_id owned by testagram-web for guarded removal."
          fi
          echo "legacy_webfinger_route_id=$legacy_webfinger_route_id" >> "$GITHUB_OUTPUT"

          # Discover the current R2 custom-domain owner instead of assuming the
          # hostname is already attached to the Worker.
          buckets="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/r2/buckets?per_page=1000" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.cursor // "") == "")' <<<"$buckets" >/dev/null || {
            echo "::error::Could not enumerate every R2 bucket; verify Workers R2 Storage Read/Write permissions and bucket pagination."
            jq -c '.errors // []' <<<"$buckets"; exit 1;
          }
          r2_match_file="$(mktemp)"
          trap 'rm -f "$r2_match_file"' EXIT
          while IFS= read -r bucket; do
            [[ -n "$bucket" ]] || continue
            custom="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/r2/buckets/$bucket/domains/custom" -H "Authorization: Bearer $CF_API_TOKEN")"
            jq -e '.success == true' <<<"$custom" >/dev/null || {
              echo "::error::Could not inspect R2 custom-domain ownership for a bucket; refusing cutover."
              jq -c '.errors // []' <<<"$custom"; exit 1;
            }
            jq -c --arg bucket "$bucket" '.domains[]? | select(.domain=="media.testagram.site") | . + {bucket:$bucket}' <<<"$custom" >> "$r2_match_file"
          done < <(jq -r '.result.buckets[]?.name' <<<"$buckets")
          r2_count="$(wc -l < "$r2_match_file" | tr -d ' ')"
          [[ "$r2_count" -le 1 ]] || {
            echo "::error::media.testagram.site is attached to multiple R2 buckets; refusing ambiguous ownership transfer."
            exit 1;
          }
          worker_domain="$(jq -c --arg host "media.testagram.site" --arg zone "$zone_id" '.result[]? | select(.hostname==$host and .zone_id==$zone)' <<<"$domains" | head -n 1)"
          if [[ "$r2_count" == "1" ]]; then
            r2_owner="$(cat "$r2_match_file")"
            [[ "$(jq -r '.status.ownership // empty' <<<"$r2_owner")" == "active" && "$(jq -r '.status.ssl // empty' <<<"$r2_owner")" == "active" && "$(jq -r '.enabled // false' <<<"$r2_owner")" == "true" ]] || {
              echo "::error::R2 custom domain ownership, TLS or enabled state is not healthy; refusing cutover."
              exit 1;
            }
            [[ -z "$worker_domain" ]] || {
              echo "::error::media.testagram.site is simultaneously listed as an R2 domain and Worker custom domain; refusing ambiguous ownership."
              exit 1;
            }
            echo "r2_bucket=$(jq -r '.bucket' <<<"$r2_owner")" >> "$GITHUB_OUTPUT"
            echo "r2_domain=$(jq -c '{domain,enabled,zoneId,ciphers,minTLS} | with_entries(select(.value != null))' <<<"$r2_owner" | base64 -w0)" >> "$GITHUB_OUTPUT"
            echo "media.testagram.site is currently owned by one active R2 bucket; a controlled Worker transfer is required."
          elif [[ -n "$worker_domain" ]]; then
            [[ "$(jq -r '.service' <<<"$worker_domain")" == "testagram-cdn" ]] || {
              echo "::error::media.testagram.site is attached to an unexpected Worker; refusing cutover."
              exit 1;
            }
            echo "r2_bucket=" >> "$GITHUB_OUTPUT"
            echo "r2_domain=" >> "$GITHUB_OUTPUT"
            echo "media.testagram.site is already attached to the canonical testagram-cdn Worker."
          else
            echo "::error::media.testagram.site has no verifiable R2 or canonical Worker owner; refusing to overwrite routing."
            exit 1
          fi

          apex_dns="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records?name=testagram.site&per_page=100" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and (.result | any(.[]; .proxied == true and (.type == "A" or .type == "AAAA" or .type == "CNAME")))' <<<"$apex_dns" >/dev/null || {
            echo "::error::testagram.site must have an existing proxied A/AAAA/CNAME record for its exact Worker Route. No DNS records will be changed."
            jq -c '.errors // .result' <<<"$apex_dns"; exit 1;
          }
          api_dns="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records?name=api.testagram.site&per_page=100" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$api_dns" >/dev/null || {
            echo "::error::Cannot enumerate all api.testagram.site DNS records."
            jq -c '.errors // []' <<<"$api_dns"; exit 1;
          }
          if [[ -n "$api_domain_owner_service" ]]; then
            jq -e '.result | length > 0 and all(.[]; .proxied == true and (.type == "A" or .type == "AAAA" or .type == "CNAME"))' <<<"$api_dns" >/dev/null || {
              echo "::error::The verified API Worker custom domain has no valid proxied DNS record set; refusing transfer."
              jq -c '.errors // .result' <<<"$api_dns"; exit 1;
            }
          else
            jq -e '.result | length == 0' <<<"$api_dns" >/dev/null || {
              echo "::error::api.testagram.site has DNS records but no verified Worker custom-domain owner. Review the DNS owner manually before creating a new Custom Domain."
              jq -c '.result' <<<"$api_dns"; exit 1;
            }
          fi
          www_dns="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records?name=www.testagram.site&per_page=100" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and (.result | any(.[]; .proxied == true and (.type == "A" or .type == "AAAA" or .type == "CNAME")))' <<<"$www_dns" >/dev/null || {
            echo "::error::www.testagram.site must have an existing proxied A/AAAA/CNAME record for its exact Worker Route. No DNS records will be changed."
            jq -c '.errors // .result' <<<"$www_dns"; exit 1;
          }
          echo "Cloudflare zone, Pages ownership, Worker routes/custom domains, apex/www DNS and exact API custom-domain ownership passed preflight. A separately approved API transfer replaces only api.testagram.site DNS records; verified R2 media binding, stale WebFinger route and Pages associations remain guarded by exact-owner checks and rollback."

      - name: Test canonical gateway contract
        working-directory: cloudflare
        run: npm test

      - name: Capture the active Cloudflare deployment for emergency manual rollback
        id: previous_deployment
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          deployments="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS \
            "$API/accounts/$CF_ACCOUNT_ID/workers/scripts/testagram-cdn/deployments?per_page=100&page=1" \
            -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and (.result.deployments | length >= 1)' <<<"$deployments" >/dev/null || {
            echo "::error::Cannot capture the current Cloudflare Worker deployment; refusing a cutover without rollback."
            jq -c '.errors // []' <<<"$deployments"
            exit 1
          }
          versions="$(jq -c '.result.deployments[0].versions' <<<"$deployments")"
          jq -e 'type == "array" and length > 0 and all(.[]; (.version_id | type == "string" and length > 0) and (.percentage | type == "number" and . > 0))' <<<"$versions" >/dev/null || {
            echo "::error::The active Cloudflare deployment has no valid version split; refusing a cutover without rollback."
            exit 1
          }
          jq -e '([.[].percentage] | add) == 100' <<<"$versions" >/dev/null || {
            echo "::error::The active Cloudflare deployment does not route exactly 100 percent of traffic; refusing an unsafe rollback snapshot."
            exit 1
          }
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Captured the active Cloudflare deployment version split for rollback."

      - name: Release the existing R2 custom-domain binding for Go CDN ownership
        id: detach_r2_domain
        if: steps.preflight.outputs.r2_bucket != ''
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          BUCKET="${{ steps.preflight.outputs.r2_bucket }}"
          curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE \
            "$API/accounts/$CF_ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom/media.testagram.site" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq -e '.success == true' >/dev/null
          for attempt in $(seq 1 30); do
            state="$(curl --retry 2 --retry-all-errors -fsS \
              "$API/accounts/$CF_ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom" \
              -H "Authorization: Bearer $CF_API_TOKEN")"
            if ! jq -e '.domains[]? | select(.domain=="media.testagram.site")' <<<"$state" >/dev/null; then
              echo "R2 custom-domain binding released; bucket and objects remain untouched."
              exit 0
            fi
            sleep 2
          done
          echo "::error::R2 custom-domain binding did not detach; refusing Worker deployment."
          exit 1

      - name: Detach only the explicitly approved legacy API custom domain
        id: detach_legacy_api_domain
        if: steps.preflight.outputs.legacy_api_domain_id != ''
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          domain_id="${{ steps.preflight.outputs.legacy_api_domain_id }}"
          zone_id="${{ steps.preflight.outputs.zone_id }}"
          current="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/workers/domains/$domain_id" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e --arg id "$domain_id" --arg zone "$zone_id" '.success == true and .result.id == $id and .result.hostname == "api.testagram.site" and .result.service == "testagram-api" and .result.zone_id == $zone and .result.enabled == true and ((.result.previews_enabled // false) == false)' <<<"$current" >/dev/null || {
            echo "::error::The exact API custom-domain owner changed after preflight; refusing to detach it."
            jq -c '{errors,result}' <<<"$current"; exit 1;
          }
          curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE "$API/accounts/$CF_ACCOUNT_ID/workers/domains/$domain_id" -H "Authorization: Bearer $CF_API_TOKEN" | jq -e '.success == true' >/dev/null
          detached=false
          for attempt in $(seq 1 30); do
            state="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
            jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$state" >/dev/null || {
              echo "::error::Cannot verify API custom-domain detachment; refusing to continue."
              exit 1;
            }
            if ! jq -e --arg zone "$zone_id" '.result[]? | select(.hostname == "api.testagram.site" and .zone_id == $zone)' <<<"$state" >/dev/null; then
              detached=true
              break
            fi
            sleep 2
          done
          [[ "$detached" == "true" ]] || {
            echo "::error::The legacy API custom-domain binding remains after 60 seconds; refusing Worker deployment."
            exit 1
          }
          echo "Verified the exact legacy API Worker custom domain is detached; Wrangler will attach the canonical gateway domain next."

      - name: Release only api.testagram.site DNS records for the custom-domain handoff
        id: release_api_dns
        if: steps.preflight.outputs.legacy_api_domain_id != ''
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          zone_id="${{ steps.preflight.outputs.zone_id }}"
          records="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records?name=api.testagram.site&per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$records" >/dev/null || {
            echo "::error::Cannot enumerate all api.testagram.site DNS records; refusing custom-domain transfer."
            exit 1
          }
          ids="$(jq -r '.result[]? | .id' <<<"$records")"
          while IFS= read -r record_id; do
            [[ -n "$record_id" ]] || continue
            record="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records/$record_id" -H "Authorization: Bearer $CF_API_TOKEN")"
            jq -e --arg id "$record_id" '.success == true and .result.id == $id and .result.name == "api.testagram.site" and .result.proxied == true and (.result.type == "A" or .result.type == "AAAA" or .result.type == "CNAME")' <<<"$record" >/dev/null || {
              echo "::error::DNS record $record_id changed or is not an exact proxied API hostname record; refusing to delete it."
              jq -c '{errors,result}' <<<"$record"
              exit 1
            }
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE "$API/zones/$zone_id/dns_records/$record_id" -H "Authorization: Bearer $CF_API_TOKEN" | jq -e '.success == true' >/dev/null
          done <<<"$ids"
          released=false
          for attempt in $(seq 1 30); do
            remaining="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records?name=api.testagram.site&per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
            jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$remaining" >/dev/null || {
              echo "::error::Cannot verify API DNS record release."
              exit 1
            }
            if jq -e '.result | length == 0' <<<"$remaining" >/dev/null; then
              released=true
              break
            fi
            sleep 2
          done
          [[ "$released" == "true" ]] || {
            echo "::error::api.testagram.site DNS records remain after exact release; refusing custom-domain deployment."
            exit 1
          }
          echo "Verified only the exact api.testagram.site DNS records were released; Wrangler will create the canonical Worker Custom Domain and its DNS/TLS binding."

      - name: Store the InstaBox recovery credential as a Cloudflare Worker secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$INSTABOX_API_KEY" || { echo "::error::INSTABOX_API_KEY is required for incoming-traffic recovery."; exit 1; }
          printf '%s' "$INSTABOX_API_KEY" | npx --yes wrangler@4 secret put INSTABOX_API_KEY --config cloudflare/wrangler.toml

      - name: Detach only the verified apex and www hostnames from Flutter Pages
        if: steps.preflight.outputs.pages_attached == 'true' || steps.preflight.outputs.www_pages_attached == 'true'
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          base="$API/accounts/$CF_ACCOUNT_ID/pages/projects/testagram-flutter-web/domains"
          for domain in testagram.site www.testagram.site; do
            endpoint="$base/$domain"
            current_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/pages-domain-current.json -w '%{http_code}' "$endpoint" -H "Authorization: Bearer $CF_API_TOKEN" || true)"
            if [[ "$current_status" == "404" ]]; then
              echo "$domain is already detached from Pages."
              continue
            fi
            if [[ "$current_status" != "200" ]] || ! jq -e --arg domain "$domain" '.success == true and .result.name == $domain' /tmp/pages-domain-current.json >/dev/null; then
              echo "::error::The exact Pages association for $domain changed after preflight; refusing to detach an unexpected hostname."
              jq -c '{errors,result}' /tmp/pages-domain-current.json 2>/dev/null || true
              exit 1
            fi
            removed="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE "$endpoint" -H "Authorization: Bearer $CF_API_TOKEN")"
            jq -e '.success == true' <<<"$removed" >/dev/null || {
              echo "::error::Cloudflare did not confirm removal of the exact $domain Pages association."
              jq -c '{errors,result}' <<<"$removed"; exit 1;
            }
            detached=false
            for attempt in $(seq 1 30); do
              status="$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/pages-domain-detached.json -w '%{http_code}' "$endpoint" -H "Authorization: Bearer $CF_API_TOKEN" || true)"
              if [[ "$status" == "404" ]]; then detached=true; break; fi
              sleep 2
            done
            [[ "$detached" == "true" ]] || {
              echo "::error::Cloudflare did not confirm that $domain detached from Pages after 60 seconds."
              jq -c '{errors,result}' /tmp/pages-domain-detached.json 2>/dev/null || true
              exit 1
            }
            echo "Verified $domain is detached from Flutter Pages; DNS and the Pages project remain untouched."
          done

      - name: Deploy Worker gateway on canonical API, media, www and apex hostnames
        id: deploy_gateway
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy --config wrangler.toml --var "API_ORIGIN:${{ steps.validate_origins.outputs.api_origin }}" --var "CDN_ORIGIN:${{ steps.validate_origins.outputs.cdn_origin }}" --var "APEX_ORIGIN:${{ steps.validate_origins.outputs.apex_origin }}" --var "MACHINE_ID:${{ inputs.machine_id }}"

      - name: Verify api.testagram.site is owned by the canonical gateway
        id: verify_api_domain
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          zone_id="${{ steps.preflight.outputs.zone_id }}"
          domains="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$domains" >/dev/null || {
            echo "::error::Cannot enumerate Worker custom domains after API handoff."
            exit 1
          }
          matches="$(jq -c --arg zone "$zone_id" '[.result[]? | select(.hostname=="api.testagram.site" and .zone_id==$zone)]' <<<"$domains")"
          jq -e 'length == 1 and .[0].service == "testagram-cdn" and .[0].enabled == true and ((.[0].previews_enabled // false) == false)' <<<"$matches" >/dev/null || {
            echo "::error::api.testagram.site is not attached exactly once to the enabled production testagram-cdn Worker."
            jq -c '.' <<<"$matches"
            exit 1
          }
          echo "Verified api.testagram.site custom-domain ownership by the canonical gateway."

      - name: Remove the exact stale WebFinger route from Flutter Pages Worker
        if: steps.preflight.outputs.legacy_webfinger_route_id != ''
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          zone_id="${{ steps.preflight.outputs.zone_id }}"
          route_id="${{ steps.preflight.outputs.legacy_webfinger_route_id }}"
          routes="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/workers/routes?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e --arg id "$route_id" '.success == true and any(.result[]?; .id == $id and .pattern == "testagram.site/.well-known/webfinger*" and .script == "testagram-web")' <<<"$routes" >/dev/null || {
            echo "::error::The exact legacy WebFinger route changed after preflight; refusing to delete an unexpected route."
            exit 1
          }
          curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE "$API/zones/$zone_id/workers/routes/$route_id" -H "Authorization: Bearer $CF_API_TOKEN" | jq -e '.success == true' >/dev/null
          for attempt in $(seq 1 30); do
            remaining="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/workers/routes?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
            if ! jq -e '.result[]? | select(.pattern == "testagram.site/.well-known/webfinger*")' <<<"$remaining" >/dev/null; then
              echo "Verified the stale WebFinger-to-Flutter route is removed; the canonical apex Worker can now receive WebFinger and NodeInfo requests."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The conflicting WebFinger route remains after deletion; refusing to deploy the canonical catch-all."
          exit 1

      - name: Verify canonical API, Go CDN, Flutter web and apex identities
        id: verify_gateway
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          check_public_federation() {
            local dir="$1" resource actor_url status content_type
            status="$(curl -sS --connect-timeout 5 --max-time 15 -H 'Accept: application/json' -D "$dir/nodeinfo-discovery.headers" -o "$dir/nodeinfo-discovery.json" -w '%{http_code}' "https://testagram.site/.well-known/nodeinfo?release_probe=$GITHUB_RUN_ID" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$dir/nodeinfo-discovery.headers" | tail -n1 | tr '[:upper:]' '[:lower:]')"
            if [[ "$status" != "200" || "$content_type" != application/json* ]] || ! jq -e '.links | any(.rel == "http://nodeinfo.diaspora.software/ns/schema/2.1" and .href == "https://testagram.site/nodeinfo/2.1")' "$dir/nodeinfo-discovery.json" >/dev/null 2>&1; then
              echo "::warning::Public apex NodeInfo discovery is not valid yet (HTTP $status; $content_type)."
              return 1
            fi

            status="$(curl -sS --connect-timeout 5 --max-time 15 -H 'Accept: application/json' -D "$dir/nodeinfo.headers" -o "$dir/nodeinfo.json" -w '%{http_code}' "https://testagram.site/nodeinfo/2.1?release_probe=$GITHUB_RUN_ID" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$dir/nodeinfo.headers" | tail -n1 | tr '[:upper:]' '[:lower:]')"
            if [[ "$status" != "200" || "$content_type" != application/json* ]] || ! jq -e '.version == "2.1" and .software.name == "testagram" and (.protocols | index("activitypub") != null)' "$dir/nodeinfo.json" >/dev/null 2>&1; then
              echo "::warning::Public apex NodeInfo 2.1 document is not valid yet (HTTP $status; $content_type)."
              return 1
            fi

            resource="acct:crissbeat@testagram.site"
            status="$(curl -sS --connect-timeout 5 --max-time 15 -H 'Accept: application/jrd+json' --get --data-urlencode "resource=$resource" -D "$dir/webfinger.headers" -o "$dir/webfinger.json" -w '%{http_code}' "https://testagram.site/.well-known/webfinger" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$dir/webfinger.headers" | tail -n1 | tr '[:upper:]' '[:lower:]')"
            if [[ "$status" != "200" || ( "$content_type" != application/jrd+json* && "$content_type" != application/json* ) ]] || ! jq -e --arg resource "$resource" '.subject == $resource and (.links | any(.rel == "self" and .type == "application/activity+json" and .href == "https://testagram.site/users/crissbeat"))' "$dir/webfinger.json" >/dev/null 2>&1; then
              echo "::warning::The real production account has not resolved through public WebFinger yet (HTTP $status; $content_type)."
              return 1
            fi

            actor_url="$(jq -r '.links[] | select(.rel == "self" and .type == "application/activity+json") | .href' "$dir/webfinger.json" | head -n1)"
            status="$(curl -sS --connect-timeout 5 --max-time 15 -H 'Accept: application/activity+json' -D "$dir/actor.headers" -o "$dir/actor.json" -w '%{http_code}' "$actor_url" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$dir/actor.headers" | tail -n1 | tr '[:upper:]' '[:lower:]')"
            if [[ "$status" != "200" || "$content_type" != application/activity+json* ]] || ! jq -e --arg actor "$actor_url" '.type == "Person" and .id == $actor and .preferredUsername == "crissbeat" and .publicKey.owner == $actor and (.publicKey.publicKeyPem | type == "string" and contains("BEGIN PUBLIC KEY"))' "$dir/actor.json" >/dev/null 2>&1; then
              echo "::warning::The public ActivityPub actor document is not valid yet (HTTP $status; $content_type)."
              return 1
            fi

            resource="acct:testagramprobe2026@testagram.site"
            status="$(curl -sS --connect-timeout 5 --max-time 15 -H 'Accept: application/jrd+json' --get --data-urlencode "resource=$resource" -o "$dir/unknown.json" -w '%{http_code}' "https://testagram.site/.well-known/webfinger" || true)"
            if [[ "$status" != "404" ]] || ! jq -e '.error == "account_not_found"' "$dir/unknown.json" >/dev/null 2>&1; then
              echo "::warning::The public WebFinger unknown-account negative control is not correct yet (HTTP $status)."
              return 1
            fi
            return 0
          }
          for attempt in $(seq 1 30); do
            api_status="$(curl -sS --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' -D "$tmp/api.headers" -o "$tmp/api.json" -w '%{http_code}' "https://api.testagram.site/healthz?release_probe=$GITHUB_RUN_ID" || true)"
            api_ready="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "https://api.testagram.site/readyz?release_probe=$GITHUB_RUN_ID" || true)"
            api_metrics="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "https://api.testagram.site/metrics?release_probe=$GITHUB_RUN_ID" || true)"
            tv_catalog_status="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp/tv-catalog" -w '%{http_code}' "https://api.testagram.site/internal/tv/catalog?release_probe=$GITHUB_RUN_ID" || true)"
            media_status="$(curl -sS --connect-timeout 5 --max-time 15 -H 'Cache-Control: no-cache' -D "$tmp/media.headers" -o "$tmp/media.json" -w '%{http_code}' "https://media.testagram.site/healthz?release_probe=$GITHUB_RUN_ID" || true)"
            media_ready="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "https://media.testagram.site/readyz?release_probe=$GITHUB_RUN_ID" || true)"
            media_metrics="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "https://media.testagram.site/metrics?release_probe=$GITHUB_RUN_ID" || true)"
            apex_health="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp/apex-health.json" -w '%{http_code}' "https://testagram.site/_testagram/edge-health?release_probe=$GITHUB_RUN_ID" || true)"
            apex_root="$(curl -sS --connect-timeout 5 --max-time 15 -D "$tmp/apex-root.headers" -o /dev/null -w '%{http_code}' "https://testagram.site/?release_probe=$GITHUB_RUN_ID" || true)"
            www_health="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp/www-health.json" -w '%{http_code}' "https://www.testagram.site/healthz?release_probe=$GITHUB_RUN_ID" || true)"
            www_root="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp/www-root.html" -w '%{http_code}' "https://www.testagram.site/?release_probe=$GITHUB_RUN_ID" || true)"
            if [[ "$api_status" == "200" && "$api_ready" == "404" && "$api_metrics" == "404" && "$tv_catalog_status" == "401" ]] &&
               grep -Eiq '^x-testagram-service:[[:space:]]*testagram-api[[:space:]]*$' "$tmp/api.headers" &&
               jq -e '.ok == true and .service == "testagram-api"' "$tmp/api.json" >/dev/null &&
               [[ "$media_status" == "200" && "$media_ready" == "404" && "$media_metrics" == "404" ]] &&
               grep -Eiq '^x-testagram-cdn:[[:space:]]*testagram-edge[[:space:]]*$' "$tmp/media.headers" &&
               grep -Eiq '^x-testagram-cdn-version:[[:space:]]*2026-11-15-private-health-listener-v1[[:space:]]*$' "$tmp/media.headers" &&
               jq -e '.ok == true and .service == "testagram-cdn"' "$tmp/media.json" >/dev/null &&
               [[ "$apex_health" == "200" && "$apex_root" == "308" ]] &&
               jq -e '.ok == true and .service == "testagram-apex-edge"' "$tmp/apex-health.json" >/dev/null &&
               grep -Fqi 'https://www.testagram.site' "$tmp/apex-root.headers" &&
               [[ "$www_health" == "200" && "$www_root" == "200" ]] &&
               jq -e '.ok == true and .service == "testagram-web"' "$tmp/www-health.json" >/dev/null &&
               grep -Fq 'flutter_bootstrap.js' "$tmp/www-root.html"; then
              if ! check_public_federation "$tmp"; then
                sleep 10
                continue
              fi
              private_status="$(curl -sS --connect-timeout 5 --max-time 15 -o "$tmp/private" -w '%{http_code}' "https://media.testagram.site/v1/users/cdn-smoke/0123456789abcdef0123456789abcdef" || true)"
              case "$private_status" in 401|403|404) ;; *) echo "::error::Canonical CDN allowed unauthenticated private media (HTTP $private_status)."; cat "$tmp/private"; exit 1 ;; esac
              echo "api.testagram.site, media.testagram.site, www.testagram.site and testagram.site identify their pinned services; apex redirects to the self-hosted Flutter frontend and WebFinger reaches Federation."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Canonical hostname routing did not converge: API=$api_status API_READY=$api_ready API_METRICS=$api_metrics TV_CATALOG=$tv_catalog_status CDN=$media_status CDN_READY=$media_ready CDN_METRICS=$media_metrics APEX_HEALTH=$apex_health APEX_ROOT=$apex_root APEX_FEDERATION=not-ready WWW_HEALTH=$www_health WWW_ROOT=$www_root."
          cat "$tmp/api.headers" "$tmp/api.json" "$tmp/media.headers" "$tmp/media.json" 2>/dev/null || true
          exit 1

      # Do not automatically roll back the Worker after API/apex cutover: an older
      # version may not recognize the canonical apex route. The www-only failure
      # recovery above removes only the www route before restoring its Pages owner.
      - name: Restore www Pages ownership if the self-hosted web cutover fails
        if: failure() && steps.preflight.outputs.www_pages_attached == 'true' && steps.verify_gateway.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          zone_id="${{ steps.preflight.outputs.zone_id }}"
          pages_endpoint="$API/accounts/$CF_ACCOUNT_ID/pages/projects/testagram-flutter-web/domains/www.testagram.site"
          current_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/www-pages-rollback.json -w '%{http_code}' "$pages_endpoint" -H "Authorization: Bearer $CF_API_TOKEN" || true)"
          if [[ "$current_status" == "200" ]] && jq -e '.success == true and .result.name == "www.testagram.site"' /tmp/www-pages-rollback.json >/dev/null; then
            echo "www.testagram.site is already attached to Pages; no rollback action is required."
            exit 0
          fi
          [[ "$current_status" == "404" ]] || {
            echo "::error::Cannot safely restore Pages because www domain ownership is ambiguous (HTTP $current_status)."
            jq -c '{success,errors,result}' /tmp/www-pages-rollback.json 2>/dev/null || true
            exit 1
          }
          routes="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/workers/routes?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$routes" >/dev/null || {
            echo "::error::Cannot enumerate Worker routes for safe www rollback; Pages will not be reattached."
            exit 1
          }
          route="$(jq -c '.result[]? | select(.pattern=="www.testagram.site/*")' <<<"$routes" | head -n 1)"
          if [[ -n "$route" ]]; then
            script="$(jq -r '.script // empty' <<<"$route")"
            route_id="$(jq -r '.id // empty' <<<"$route")"
            [[ "$script" == "testagram-cdn" && -n "$route_id" ]] || {
              echo "::error::Unexpected Worker owns www.testagram.site; refusing to remove it or reattach Pages."
              exit 1
            }
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE "$API/zones/$zone_id/workers/routes/$route_id" -H "Authorization: Bearer $CF_API_TOKEN" | jq -e '.success == true' >/dev/null
          fi
          verified_routes="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/workers/routes?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          if jq -e '.result[]? | select(.pattern=="www.testagram.site/*")' <<<"$verified_routes" >/dev/null; then
            echo "::error::The www Worker route remains active; refusing to reattach Pages underneath it."
            exit 1
          fi
          restored="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X POST "$API/accounts/$CF_ACCOUNT_ID/pages/projects/testagram-flutter-web/domains" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" -d '{"name":"www.testagram.site"}')"
          jq -e '.success == true' <<<"$restored" >/dev/null || {
            echo "::error::Could not reattach www.testagram.site to the previous Flutter Pages origin."
            jq -c '{errors,messages}' <<<"$restored"
            exit 1
          }
          verify="$(curl --retry 2 --retry-all-errors -fsS "$pages_endpoint" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and .result.name == "www.testagram.site"' <<<"$verify" >/dev/null || {
            echo "::error::Pages reattachment was accepted but could not be verified."
            exit 1
          }
          echo "Restored and verified www.testagram.site on its previous Flutter Pages association. The apex and API/media routes were not changed."

      - name: Restore the previous R2 hostname owner if Go CDN cutover fails
        if: failure() && steps.preflight.outputs.r2_bucket != '' && steps.detach_r2_domain.outcome != 'skipped' && steps.verify_gateway.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          BUCKET="${{ steps.preflight.outputs.r2_bucket }}"
          DOMAIN_JSON="$(echo '${{ steps.preflight.outputs.r2_domain }}' | base64 -d)"
          workers="$(curl --retry 2 --retry-all-errors -fsS \
            "$API/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100&page=1" \
            -H "Authorization: Bearer $CF_API_TOKEN")"
          worker_id="$(jq -r '.result[]? | select(.hostname=="media.testagram.site" and .service=="testagram-cdn") | .id' <<<"$workers" | head -n 1)"
          if [[ -n "$worker_id" ]]; then
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE \
              "$API/accounts/$CF_ACCOUNT_ID/workers/domains/$worker_id" \
              -H "Authorization: Bearer $CF_API_TOKEN" | jq -e '.success == true' >/dev/null
          fi
          current_r2="$(curl --retry 2 --retry-all-errors -fsS \
            "$API/accounts/$CF_ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom" \
            -H "Authorization: Bearer $CF_API_TOKEN")"
          if jq -e '.domains[]? | select(.domain=="media.testagram.site")' <<<"$current_r2" >/dev/null; then
            echo "Previous R2 binding is already present; no restore POST needed."
            exit 0
          fi
          restored="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X POST \
            "$API/accounts/$CF_ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" -d "$DOMAIN_JSON")"
          jq -e '.success == true' <<<"$restored" >/dev/null || {
            echo "::error::Automatic Worker-to-R2 rollback failed. Restore media.testagram.site to bucket $BUCKET manually using the captured R2 domain settings."
            jq -c '.errors // []' <<<"$restored"; exit 1;
          }
          verify="$(curl --retry 2 --retry-all-errors -fsS \
            "$API/accounts/$CF_ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom/media.testagram.site" \
            -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and .result.domain=="media.testagram.site" and .result.enabled==true' <<<"$verify" >/dev/null || {
            echo "::error::R2 binding restore was accepted but could not be verified."
            exit 1;
          }
          echo "Previous R2 hostname ownership restored and verified; no bucket objects were changed."
      - name: Restore the previous API Worker custom-domain owner if gateway cutover fails
        if: failure() && steps.preflight.outputs.legacy_api_domain_payload != '' && steps.detach_legacy_api_domain.outcome != 'skipped' && steps.verify_gateway.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          zone_id="${{ steps.preflight.outputs.zone_id }}"
          previous_domain="$(echo '${{ steps.preflight.outputs.legacy_api_domain_payload }}' | base64 -d)"
          domains="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$domains" >/dev/null || {
            echo "::error::Cannot enumerate Worker domains for API rollback; manual ownership recovery is required."
            exit 1
          }
          current="$(jq -c --arg zone "$zone_id" '[.result[]? | select(.hostname=="api.testagram.site" and .zone_id==$zone)]' <<<"$domains")"
          count="$(jq 'length' <<<"$current")"
          [[ "$count" -le 1 ]] || {
            echo "::error::Multiple API custom-domain owners appeared during rollback; refusing ambiguous mutation."
            jq -c '.' <<<"$current"; exit 1
          }
          if [[ "$count" == "1" ]]; then
            owner="$(jq -c '.[0]' <<<"$current")"
            service="$(jq -r '.service // empty' <<<"$owner")"
            if [[ "$service" == "testagram-api" ]]; then
              jq -e '.enabled == true' <<<"$owner" >/dev/null || {
                echo "::error::The previous API Worker domain exists but is disabled; refusing to claim rollback success."
                exit 1
              }
              echo "The previous API Worker custom domain is already restored."
              exit 0
            fi
            [[ "$service" == "testagram-cdn" ]] || {
              echo "::error::Unexpected Worker $service owns api.testagram.site during rollback; refusing to detach it."
              exit 1
            }
            new_domain_id="$(jq -r '.id // empty' <<<"$owner")"
            [[ -n "$new_domain_id" ]] || {
              echo "::error::The canonical gateway API domain has no ID; refusing unsafe rollback."
              exit 1
            }
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE "$API/accounts/$CF_ACCOUNT_ID/workers/domains/$new_domain_id" -H "Authorization: Bearer $CF_API_TOKEN" | jq -e '.success == true' >/dev/null
          fi
          detached=false
          for attempt in $(seq 1 30); do
            state="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
            if ! jq -e --arg zone "$zone_id" '.result[]? | select(.hostname=="api.testagram.site" and .zone_id==$zone)' <<<"$state" >/dev/null; then
              detached=true
              break
            fi
            sleep 2
          done
          [[ "$detached" == "true" ]] || {
            echo "::error::The failed gateway API domain remains attached; refusing to attach the previous owner over it."
            exit 1
          }
          # A Worker Custom Domain cannot be reattached over an existing CNAME.
          # Remove only proxied A/AAAA/CNAME records for this exact hostname;
          # the old custom-domain attach below recreates its managed DNS/TLS.
          dns_records="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records?name=api.testagram.site&per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and ((.result_info.total_pages // 1) <= 1)' <<<"$dns_records" >/dev/null || {
            echo "::error::Cannot enumerate exact API DNS records for rollback."
            exit 1
          }
          dns_ids="$(jq -r '.result[]? | .id' <<<"$dns_records")"
          while IFS= read -r record_id; do
            [[ -n "$record_id" ]] || continue
            record="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records/$record_id" -H "Authorization: Bearer $CF_API_TOKEN")"
            jq -e --arg id "$record_id" '.success == true and .result.id == $id and .result.name == "api.testagram.site" and .result.proxied == true and (.result.type == "A" or .result.type == "AAAA" or .result.type == "CNAME")' <<<"$record" >/dev/null || {
              echo "::error::Unexpected or non-proxied DNS record $record_id blocks safe API domain rollback."
              exit 1
            }
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X DELETE "$API/zones/$zone_id/dns_records/$record_id" -H "Authorization: Bearer $CF_API_TOKEN" | jq -e '.success == true' >/dev/null
          done <<<"$dns_ids"
          remaining_dns="$(curl --retry 2 --retry-all-errors -fsS "$API/zones/$zone_id/dns_records?name=api.testagram.site&per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e '.success == true and (.result | length == 0)' <<<"$remaining_dns" >/dev/null || {
            echo "::error::API DNS records remain; refusing to attach the previous Worker domain over ambiguous DNS."
            exit 1
          }
          restore_body="$(jq -c '{hostname,service,enabled,previews_enabled,zone_id,zone_name}' <<<"$previous")"
          restored="$(curl --retry 2 --retry-all-errors --retry-delay 2 -fsS -X PUT "$API/accounts/$CF_ACCOUNT_ID/workers/domains" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" -d "$restore_body")"
          jq -e '.success == true and .result.hostname == "api.testagram.site" and .result.service == "testagram-api" and .result.enabled == true' <<<"$restored" >/dev/null || {
            echo "::error::Automatic API custom-domain rollback failed. Reattach api.testagram.site to testagram-api using the captured previous domain settings."
            jq -c '{errors,messages,result}' <<<"$restored"
            exit 1
          }
          verified="$(curl --retry 2 --retry-all-errors -fsS "$API/accounts/$CF_ACCOUNT_ID/workers/domains?per_page=100&page=1" -H "Authorization: Bearer $CF_API_TOKEN")"
          jq -e --arg zone "$zone_id" '[.result[]? | select(.hostname=="api.testagram.site" and .zone_id==$zone and .service=="testagram-api" and .enabled==true)] | length == 1' <<<"$verified" >/dev/null || {
            echo "::error::API rollback was accepted but the previous Worker domain could not be verified."
            exit 1
          }
          echo "Previous api.testagram.site custom-domain owner restored and verified."

