name: Publish Testagram Go CDN container

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/container-release.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/container-release.yml"

permissions:
  contents: read

concurrency:
  group: testagram-cdn-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish pinned Go CDN image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trendyzima/testagram-cdn
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=raw,value=2026-11-15-private-health-listener-v1,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Testagram Go CDN
            org.opencontainers.image.description=Canonical Testagram media delivery service
            org.opencontainers.image.source=https://github.com/Trendyzima/cdn-
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only from main or a release tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
