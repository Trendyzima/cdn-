name: Validate Cloudflare gateway source (no production deployment)

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-private-r2-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Cloudflare gateway contract
        working-directory: cloudflare
        run: npm test

      - name: Validate Wrangler bundle without deploying
        working-directory: cloudflare
        run: npx --yes wrangler@4.50.0 deploy --dry-run --config wrangler.toml --outdir /tmp/testagram-gateway-dry-run
