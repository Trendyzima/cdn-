name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cdn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Cache package tests
        run: go test -v ./internal/cache
      - name: Edge unit tests
        run: go test -v -run 'TestCleanAssetPath|TestPlaybackToken|TestHealth' ./internal/edge
      - name: Edge request coalescing test
        run: go test -v -run TestRequestCoalescing ./internal/edge
      - name: Edge origin failover test
        run: go test -v -run TestOriginFailover ./internal/edge
      - name: Full test suite
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build binary
        run: go build -trimpath -o /tmp/testagram-edge ./cmd/edge

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: |
          docker build --pull -t ghcr.io/${{ github.repository_owner }}/testagram-edge:${{ github.sha }} .
          docker tag ghcr.io/${{ github.repository_owner }}/testagram-edge:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/testagram-edge:latest
      - name: Push container
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/testagram-edge:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/testagram-edge:latest
