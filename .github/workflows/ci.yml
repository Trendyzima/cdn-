name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cdn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Cache package tests
        run: go test -v ./internal/cache
      - name: Edge unit tests
        run: go test -v -run 'TestCleanAssetPath|TestPlaybackToken|TestHealth' ./internal/edge
      - name: Edge request coalescing test
        run: go test -v -run TestRequestCoalescing ./internal/edge
      - name: Edge origin failover test
        run: go test -v -run TestOriginFailover ./internal/edge
      - name: Full test suite
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build binary
        run: |
          mkdir -p container/cache
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o container/testagram-edge ./cmd/edge
          cp /etc/ssl/certs/ca-certificates.crt container/ca-certificates.crt
          touch container/cache/keep.txt
      - name: Upload container inputs
        uses: actions/upload-artifact@v4
        with:
          name: edge-container-inputs
          path: container
          retention-days: 1
          compression-level: 0

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edge-container-inputs
          path: container
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: |
          docker build -f Dockerfile.runtime -t ghcr.io/trendyzima/testagram-edge:${{ github.sha }} .
          docker tag ghcr.io/trendyzima/testagram-edge:${{ github.sha }} ghcr.io/trendyzima/testagram-edge:latest
      - name: Push container
        run: |
          docker push ghcr.io/trendyzima/testagram-edge:${{ github.sha }}
          docker push ghcr.io/trendyzima/testagram-edge:latest
