name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: cdn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -ignore 'SC2034' -ignore 'SC2086'
      - name: Cache package tests
        run: go test -v ./internal/cache
      - name: Edge unit tests
        run: go test -v -run 'TestCleanAssetPath|TestPlaybackToken|TestHealth' ./internal/edge
      - name: Edge request coalescing test
        run: go test -v -run TestRequestCoalescing ./internal/edge
      - name: Edge origin failover test
        run: go test -v -run TestOriginFailover ./internal/edge
      - name: Full test suite
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build binary
        run: |
          mkdir -p container/cache
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o container/testagram-edge ./cmd/edge
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o container/healthcheck ./cmd/healthcheck
          cp /etc/ssl/certs/ca-certificates.crt container/ca-certificates.crt
          touch container/cache/keep.txt
      - name: Validate scratch runtime image and built-in readiness probe
        run: |
          docker build -f Dockerfile.runtime -t testagram-edge:ci .
          docker run -d --name testagram-edge-ci -p 18080:8080 \
            -e ORIGIN_URL=http://127.0.0.1:1 \
            -e ORIGIN_AUTH_TOKEN=ci-only-origin-token-not-for-production \
            testagram-edge:ci
          for attempt in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' testagram-edge-ci)"
            if [[ "$state" == "healthy" ]]; then break; fi
            if [[ "$state" == "unhealthy" ]]; then docker logs testagram-edge-ci; exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' testagram-edge-ci)" = "healthy"
          docker exec testagram-edge-ci /healthcheck
          docker rm -f testagram-edge-ci
      - name: Upload container inputs
        uses: actions/upload-artifact@v4
        with:
          name: edge-container-inputs
          path: container
          retention-days: 1
          compression-level: 0

  runtime-image-verify:
    name: Verify artifact-built scratch image and writable cache
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edge-container-inputs
          path: container
      - name: Build and run the exact artifact-built scratch image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.runtime -t testagram-edge:artifact-ci .
          docker volume create testagram-edge-cache-artifact-ci >/dev/null
          cleanup() {
            docker rm -f testagram-edge-artifact-ci >/dev/null 2>&1 || true
            docker volume rm testagram-edge-cache-artifact-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name testagram-edge-artifact-ci --read-only --tmpfs /tmp \
            -v testagram-edge-cache-artifact-ci:/cache \
            -e ORIGIN_URL=http://127.0.0.1:1 \
            -e ORIGIN_AUTH_TOKEN=ci-only-origin-token-not-for-production \
            testagram-edge:artifact-ci
          for attempt in $(seq 1 30); do
            running="$(docker inspect --format '{{.State.Running}}' testagram-edge-artifact-ci)"
            if [[ "$running" != "true" ]]; then docker logs testagram-edge-artifact-ci; exit 1; fi
            state="$(docker inspect --format '{{.State.Health.Status}}' testagram-edge-artifact-ci)"
            if [[ "$state" == "healthy" ]]; then break; fi
            if [[ "$state" == "unhealthy" ]]; then docker logs testagram-edge-artifact-ci; exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' testagram-edge-artifact-ci)" = "healthy"
          docker exec testagram-edge-artifact-ci /healthcheck

  image:
    needs: [test, runtime-image-verify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edge-container-inputs
          path: container
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: |
          docker build -f Dockerfile.runtime --label org.opencontainers.image.revision=${{ github.sha }} --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} -t ghcr.io/trendyzima/testagram-edge:${{ github.sha }} .
      - name: Push container
        run: |
          docker push ghcr.io/trendyzima/testagram-edge:${{ github.sha }}
      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/trendyzima/testagram-edge:${GITHUB_SHA}
          digest="$(docker image inspect ghcr.io/trendyzima/testagram-edge:${GITHUB_SHA} --format='{{index .RepoDigests 0}}' | sed 's/.*@//')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest container provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/trendyzima/testagram-edge
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
