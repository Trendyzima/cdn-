name: Capacity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logical-500k:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: 500k logical viewer fan-out
        env:
          CAPACITY_TEST: "1"
        run: go test ./internal/edge -run TestCapacity100kLogicalViewers -count=1 -timeout 10m -v
