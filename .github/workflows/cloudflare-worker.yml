name: Cloudflare Worker

on:
  push:
    branches: [main]
    paths: ["cloudflare/**"]
  pull_request:
    paths: ["cloudflare/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

